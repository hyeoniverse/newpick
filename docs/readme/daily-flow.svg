<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="뉴픽의 하루: 매시 기사 수집, 08:30 AI 요약, 08:40 맞춤 메일">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
    .card { fill: #ffffff; stroke: #e6e4f2; stroke-width: 1.5; }
    .time { font-size: 15px; font-weight: 800; fill: #3610e1; font-variant-numeric: tabular-nums; }
    .title { font-size: 20px; font-weight: 800; fill: #111111; }
    .desc { font-size: 14px; fill: #5c5c66; }
    .chip { font-size: 12px; font-weight: 700; fill: #3610e1; }
  </style>
  <rect class="card" x="1" y="1" width="1198" height="278" rx="18"/>
  <text x="32" y="44" font-size="15" font-weight="700" fill="#3610e1" letter-spacing="0.04em">A DAY OF NEWPICK</text>

  <!-- 잇는 선 -->
  <line x1="92" y1="96" x2="1108" y2="96" stroke="#e6e4f2" stroke-width="3"/>

  <!-- 1 수집 -->
  <circle cx="92" cy="96" r="22" fill="#3610e1"/>
  <path d="M83 91 h18 M83 97 h18 M83 103 h12" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text class="time" x="70" y="152">매시 00분</text>
  <text class="title" x="70" y="180">기사 모으기</text>
  <text class="desc" x="70" y="206">네이버 뉴스 섹션 헤드라인 · 최신</text>
  <text class="desc" x="70" y="228">가벼운 모델이 분야를 고름 · 30일 보관</text>
  <rect x="148" y="136" width="108" height="24" rx="12" fill="#efedfb"/>
  <text class="chip" x="202" y="152" text-anchor="middle">30일 35,361건</text>

  <!-- 2 요약 -->
  <circle cx="440" cy="96" r="22" fill="#3610e1"/>
  <path d="M431 104 l4 -14 l9 9 l-13 5 z M441 93 l6 -6 l4 4 l-6 6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  <text class="time" x="418" y="152">08:30</text>
  <text class="title" x="418" y="180">분야별 AI 뉴스레터</text>
  <text class="desc" x="418" y="206">같은 사건 묶기 → 고르기 → Claude가 쓰기</text>
  <text class="desc" x="418" y="228">실패한 분야는 그날 안에서 자동 재시도</text>
  <rect x="474" y="136" width="112" height="24" rx="12" fill="#efedfb"/>
  <text class="chip" x="530" y="152" text-anchor="middle">6개 분야 · 매일</text>

  <!-- 3 메일 -->
  <circle cx="790" cy="96" r="22" fill="#3610e1"/>
  <rect x="779" y="88" width="22" height="16" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <path d="M780 90 l10 7 l10 -7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  <text class="time" x="768" y="152">08:40</text>
  <text class="title" x="768" y="180">사람마다 메일 한 통</text>
  <text class="desc" x="768" y="206">고른 분야 + 취향 점수로 순서 · 추천 기사</text>
  <text class="desc" x="768" y="228">팔로우한 태그 · 지켜보던 소식의 후속</text>
  <rect x="824" y="136" width="124" height="24" rx="12" fill="#efedfb"/>
  <text class="chip" x="886" y="152" text-anchor="middle">원클릭 수신 거부</text>

  <!-- 끝 -->
  <circle cx="1108" cy="96" r="8" fill="#3610e1"/>
</svg>
