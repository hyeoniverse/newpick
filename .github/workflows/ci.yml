name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'api'
        run: npx prisma generate --schema=prisma/mysql.schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - if: matrix.app == 'api'
        run: npm test
      - run: npm run build
