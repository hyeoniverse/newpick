name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 손으로 실행하면 api 변경이 없어도 이미지를 만들어 배포한다 (서버에서 직접 빌드한 이미지를 GHCR 이미지로 바꿀 때 등)
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'api'
        run: npx prisma generate --schema=prisma/mysql.schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # PR: 이미지가 빌드되는지만 본다 (main에서는 api-image가 빌드해서 올린다)
  api-docker:
    name: api docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t newpick-api apps/api

  # 서버에 떠 있는 api와 이 커밋 사이에 apps/api가 바뀌었는지 (main push). 바뀌었으면 이미지를 만들어 배포한다 (#39).
  # 직전 push와 비교하지 않는다: api를 바꾼 push의 실행이 실패하면, 다음 push에 api 변경이 없다는 이유로 그 변경이 배포에서 빠진다
  api-changes:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # 서버의 /health version (sha-커밋 7자리). 서버에 닿지 않거나 모르는 커밋이면 바뀐 것으로 친다
          deployed=$(curl -fsS --max-time 10 https://newpick-api.hyeoniverse.com/health | jq -r '.version // empty' || true)
          commit=${deployed#sha-}
          echo "서버의 api: ${deployed:-알 수 없음}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "손으로 실행: api 변경과 관계없이 이미지를 만들어 배포합니다"
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$commit" ] || ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$commit" "$GITHUB_SHA" -- apps/api; then
            echo "api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  # api 이미지: 서버(1GB)에서 빌드하지 않고 여기서 만들어 GHCR에 올린다. 서버가 amd64라 amd64만
  api-image:
    needs: [check, e2e, api-changes]
    if: needs.api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          # /health의 version. 배포가 끝나면 바깥에서 이 값으로 새 버전이 떴는지 본다
          build-args: APP_VERSION=${{ needs.api-changes.outputs.tag }}
          tags: |
            ghcr.io/hyeoniverse/newpick-api:${{ needs.api-changes.outputs.tag }}
            ghcr.io/hyeoniverse/newpick-api:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버에 배포 (DEPLOY_HOST가 없으면 건너뛴다). 실패하면 서버가 이전 버전으로 되돌린다
  api-deploy:
    needs: [api-changes, api-image]
    uses: ./.github/workflows/deploy-api.yml
    with:
      tag: ${{ needs.api-changes.outputs.tag }}
    secrets: inherit

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_URL: http://localhost:3001
      # 테스트용 로그인에 쓰는 키. api의 JWT_SECRET과 같아야 한다 (E2E 전용 값)
      E2E_JWT_SECRET: e2e-only-jwt-secret-do-not-use-in-production-0001
    steps:
      - uses: actions/checkout@v4
      - name: api 환경 변수 (E2E 전용 값)
        working-directory: apps/api
        run: |
          cat > .env <<ENV
          JWT_SECRET=${E2E_JWT_SECRET}
          JWT_REFRESH_SECRET=e2e-only-refresh-secret-do-not-use-in-production-0002
          FRONTEND_URL=http://localhost:3100
          GOOGLE_CLIENT_ID=e2e
          GOOGLE_CLIENT_SECRET=e2e
          GOOGLE_REDIRECT_URI=http://localhost:3100/api/auth/google/callback
          MAIL_USER=e2e@example.com
          MAIL_PASSWORD=e2e
          ENV
      - name: api + MySQL + MongoDB (docker compose)
        working-directory: apps/api
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:3001/category > /dev/null && exit 0; sleep 2; done
          docker compose logs api
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium webkit
      # 홈·소개는 빌드할 때 데이터를 읽어 정적으로 만들어지므로 시드 → 빌드 순서
      - working-directory: apps/web
        run: npm run e2e:seed
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
