name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'api'
        run: npx prisma generate --schema=prisma/mysql.schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-docker:
    name: api docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t newpick-api apps/api

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_URL: http://localhost:3001
      # 테스트용 로그인에 쓰는 키. api의 JWT_SECRET과 같아야 한다 (E2E 전용 값)
      E2E_JWT_SECRET: e2e-only-jwt-secret-do-not-use-in-production-0001
    steps:
      - uses: actions/checkout@v4
      - name: api 환경 변수 (E2E 전용 값)
        working-directory: apps/api
        run: |
          cat > .env <<ENV
          JWT_SECRET=${E2E_JWT_SECRET}
          JWT_REFRESH_SECRET=e2e-only-refresh-secret-do-not-use-in-production-0002
          FRONTEND_URL=http://localhost:3100
          GOOGLE_CLIENT_ID=e2e
          GOOGLE_CLIENT_SECRET=e2e
          GOOGLE_REDIRECT_URI=http://localhost:3100/api/auth/google/callback
          MAIL_USER=e2e@example.com
          MAIL_PASSWORD=e2e
          ENV
      - name: api + MySQL + MongoDB (docker compose)
        working-directory: apps/api
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:3001/category > /dev/null && exit 0; sleep 2; done
          docker compose logs api
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium webkit
      # 홈·소개는 빌드할 때 데이터를 읽어 정적으로 만들어지므로 시드 → 빌드 순서
      - working-directory: apps/web
        run: npm run e2e:seed
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
