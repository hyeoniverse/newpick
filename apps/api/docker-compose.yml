# 로컬 실행: cp .env.example .env 후 값 채우기 → docker compose up --build
services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: newpick
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3308:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1(TCP)로 확인: 첫 실행 초기화 중 임시 서버는 소켓만 열어 localhost 확인이 너무 일찍 통과함
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:7
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: on-failure
    env_file: .env
    environment:
      # 컨테이너끼리는 서비스 이름으로 접속합니다. (.env의 값보다 우선)
      MYSQL_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/newpick
      MONGO_URL: mongodb://mongo:27017/newpick
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  mysql_data:
  mongo_data:
